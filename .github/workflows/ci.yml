name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go build ./...

      # -race because hc shells out to git and reads its output; a data race
      # here would show up as a flaky staging bug, which is the worst kind.
      - run: go test -race ./... -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Installed directly rather than through golangci-lint-action: the action
      # is versioned separately from the linter and a mismatch between the two
      # (v1 action, v2 config) fails in a way that reads like a config error.
      #
      # Pin rules for every tool in this gate:
      #   1. pin an exact version -- an unpinned tool breaks CI with no change here
      #   2. keep it equal to what runs locally (`type -a`, not `brew list`)
      #   3. keep it compatible with the Go version this job uses
      #   4. review it on the date below, because a pin is a decision that rots
      #
      # v2.12.2 broke rule 3: it bundles staticcheck v0.7.0, whose IR builder
      # panics with `unexpected expr: *ast.KeyValueExpr` on the Go 1.27 standard
      # library. v2.13.0 added go1.27 support; v2.13.2 bundles staticcheck v0.8.1.
      # Review by 2026-12-01.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: golangci-lint run

      # golangci-lint's `unused` skips exported identifiers by design, so an
      # exported function with zero callers passes it. deadcode builds a call
      # graph instead and does not care about case.
      # Pinned like golangci-lint above: an unpinned tool in the gate can break
      # CI with no change to this repo, which is the hardest kind of red to read.
      - run: go install golang.org/x/tools/cmd/deadcode@v0.49.0
      - run: ./scripts/deadcode.sh
