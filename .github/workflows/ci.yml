name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go build ./...

      # -race because hc shells out to git and reads its output; a data race
      # here would show up as a flaky staging bug, which is the worst kind.
      - run: go test -race ./... -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Installed directly rather than through golangci-lint-action: the action
      # is versioned separately from the linter and a mismatch between the two
      # (v1 action, v2 config) fails in a way that reads like a config error.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run

      # golangci-lint's `unused` skips exported identifiers by design, so an
      # exported function with zero callers passes it. deadcode builds a call
      # graph instead and does not care about case.
      - run: go install golang.org/x/tools/cmd/deadcode@latest
      - run: ./scripts/deadcode.sh
